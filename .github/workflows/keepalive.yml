name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable daily scraper if disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable daily-scraper.yml --repo ${{ github.repository }} || true
          echo "Keepalive done: $(date)"
